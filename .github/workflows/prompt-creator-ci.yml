name: Prompt Creator validation

on:
  push:
    branches:
      - prompt-creator-prototype
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check prompt-creator.js
      - name: Run tests
        run: node --test prompt-creator.test.js
